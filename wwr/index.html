<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="River Rush Rafting offers exciting, safe, and unforgettable whitewater rafting adventures.">
  <meta name="author" content="Folake Folarin Akinduro">
  <title>River Rush Rafting | Home</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header>
  <img src="images/logo.png" alt="River Rush Rafting Logo">

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="trips.html">Trips</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>

<main>
  <div class="hero">
    <img src="images/hero.jpg" alt="People enjoying a whitewater rafting adventure">

    <h1>River Rush Rafting</h1>
  </div>

  <section class="newsletter">
  <h2>Stay Updated!</h2>
  <p>Sign up for news and special rafting offers.</p>

  <form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <button type="submit">Subscribe</button>
  </form>
</section>

<section class="trips-cta">
  <h2>Ready for an Adventure?</h2>
  <p>Explore our exciting rafting trips and choose your next adventure.</p>
  <a href="trips.html">View Our Trips</a>
</section>

<section class="adventures">
  <h2>Adventure Awaits You!</h2>

  <div class="adventure-gallery">

    <figure>
      <img src="images/adventure1.jpg" alt="Rafting adventure on the river">
      <figcaption>
        <h3>Los Dientes del Diablo</h3>
        <p>Experience exciting rapids and enjoy an unforgettable river adventure.</p>
      </figcaption>
    </figure>

    <figure>
      <img src="images/adventure2.jpg" alt="Whitewater rafting adventure">
      <figcaption>
        <h3>Big Mallard</h3>
        <p>Enjoy a thrilling rafting experience surrounded by beautiful scenery.</p>
      </figcaption>
    </figure>

  </div>
</section>

</main>

<footer>
  <p>&copy; 2026 River Rush Rafting | Folake Folarin Akinduro</p>

  <nav class="socialmedia">
    <a href="https://facebook.com">
      <img src="images/facebook.svg" alt="Facebook Icon">
    </a>

    <a href="https://linkedin.com">
      <img src="images/linkedin.svg" alt="LinkedIn Icon">
    </a>

    <a href="https://instagram.com">
      <img src="images/instagram.svg" alt="Instagram Icon">
    </a>
  </nav>
</footer>

</body>
</html>
